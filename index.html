<!doctype html>
<html lang="pt-BR" class="dark dark-mode" data-tema="ameixa" data-esquema="escuro">
  <head>
    <meta charset="UTF-8" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#120c1b" />
    <script>
      try {
        const tema = localStorage.getItem("pixel-tema");
        if (tema) {
          const raiz = document.documentElement;
          const claro = localStorage.getItem("pixel-esquema") === "claro";
          raiz.dataset.tema = tema;
          raiz.dataset.esquema = claro ? "claro" : "escuro";
          raiz.classList.toggle("dark", !claro);
          raiz.classList.toggle("dark-mode", !claro);
          document
            .querySelector('meta[name="color-scheme"]')
            .setAttribute("content", claro ? "light" : "dark");
          const metaFundo = document.querySelector('meta[name="theme-color"]');
          const [id, fundo] = (localStorage.getItem("pixel-tema-fundo") ?? "").split(":");
          if (id === tema && /^#(?:[0-9a-f]{3}|[0-9a-f]{6})$/i.test(fundo))
            metaFundo.setAttribute("content", fundo);
          else metaFundo.removeAttribute("content");
        }
      } catch {}
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tarefas · Pixel</title>
    <meta name="description" content="Gerenciador de tarefas acadêmicas da disciplina Desenvolvimento Frontend, ULBRA. Organize projetos, acompanhe prazos e veja suas entregas avançarem." />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:url" content="https://pixel-dfe-project.up.railway.app/" />
    <meta property="og:title" content="Pixel · Tarefas acadêmicas" />
    <meta property="og:description" content="Gerenciador de tarefas acadêmicas da disciplina Desenvolvimento Frontend, ULBRA. Organize projetos, acompanhe prazos e veja suas entregas avançarem." />
    <meta property="og:image" content="https://pixel-dfe-project.up.railway.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Tela de projetos da Pixel, com o progresso das tarefas e os prazos de cada projeto" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
